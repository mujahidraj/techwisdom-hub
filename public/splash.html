<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Starting...</title>
    <style>
        body {
            background-color: #0f172a; /* Dark Blue/Slate Background */
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
            user-select: none;
        }
        .logo {
            width: 100px;
            height: 100px;
            margin-bottom: 20px;
            /* This assumes you have the icon in the same folder (dist/techwisdom.ico) */
            /* Or simply use text if icon isn't loading in raw HTML */
        }
        h1 { font-size: 24px; font-weight: 600; margin: 0; letter-spacing: 1px; }
        p { color: #94a3b8; font-size: 14px; margin-top: 5px; }
        .loader {
            margin-top: 30px;
            width: 200px;
            height: 4px;
            background: #1e293b;
            border-radius: 4px;
            overflow: hidden;
        }
        .loader-bar {
            height: 100%;
            width: 50%;
            background: #3b82f6; /* Blue loading bar */
            border-radius: 4px;
            animation: load 2s infinite ease-in-out;
        }
        @keyframes load {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(200%); }
        }
    </style>
</head>
<body>
    <h1>TechWisdom ERP</h1>
    <p>Initializing System...</p>
    
    <div class="loader">
        <div class="loader-bar"></div>
    </div>
</body>
</html>
